<style>
/* Layout: una colonna stretta pensata per iPhone. In alto le parole chiave, sotto le schede-estetica con palette e griglia 3x3 del feed. */
:root {

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1220; --surface: #171C2E; --ink: #EDF0F8; --muted: #98A2BC;
    --line: #2A3250; --accent: #7C8CFF; --accent-ink: #0E1220; --chip: #232A45;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1220; --surface: #171C2E; --ink: #EDF0F8; --muted: #98A2BC;
  --line: #2A3250; --accent: #7C8CFF; --accent-ink: #0E1220; --chip: #232A45;
  color-scheme: dark;
}
* { box-sizing: border-box; }

}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.1; }
h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; }

function norm(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim(); }
function toks(s){ return norm(s).split(/[^a-z0-9]+/).filter(function(w){ return w.length > 1; }); }
function hash(s){ var h = 2166136261; for (var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619); } return h>>>0; }
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed>>>15, 1|seed); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function cap(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function textOn(hex){ var n=parseInt(hex.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255; return (0.299*r+0.587*g+0.114*b) > 150 ? '#111111' : '#FFFFFF'; }
function shuffle(arr, r){ var a=arr.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(r()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

function matchKw(a, text, tk){
  var out = [];
  a.kw.forEach(function(k){
    var nk = norm(k), hit;
    if (nk.indexOf(' ') > -1) hit = text.indexOf(nk) > -1;
    else hit = tk.some(function(t){ return t===nk || (t.length>=4 && nk.length>=4 && (nk.indexOf(t)===0 || t.indexOf(nk)===0 || t.slice(0,5)===nk.slice(0,5))); });
    if (hit) out.push(k);
  });
  return out;
}

function words(input){
  var seen = {}, out = [];
  input.split(/[,;\n]+|\s+/).forEach(function(w){ w = w.trim(); var n = norm(w); if (w && n.length>1 && !seen[n]) { seen[n]=1; out.push(w); } });
  return out.slice(0,6);
}

function build(a, matched, r, w){

    ideas: shuffle(a.ideas, r).slice(0,6), tag:a.tag, matched:matched, words:w, fusione:false };
}

function generate(input, seed){

  var scored = LIB.map(function(a){ var m = matchKw(a,text,tk); return { a:a, m:m, s: m.length + r()*(seed ? 1.6 : 0.4) }; })
    .sort(function(x,y){ return y.s - x.s; });
  var A = scored[0], B = scored[1];
  var first = build(A.a, A.m, r, w), second = build(B.a, B.m, r, w);
  var main = w[0] || 'Il mio';
  var mixIdeas = first.ideas.slice(0,3).concat(second.ideas.slice(0,3));
  var all = A.m.concat(B.m);
  var fus = { nome: cap(norm(main)==='' ? 'Il mio' : main) + ' ' + SUFFIX[Math.floor(r()*SUFFIX.length)],
    desc:'Un mix di ' + A.a.nome + ' e ' + B.a.nome + ', costruito sulle tue parole.',
    pal:[A.a.pal[0],A.a.pal[2],B.a.pal[1],B.a.pal[3],B.a.pal[4]],
    font: A.a.font.split(' + ')[0] + ' + ' + B.a.font.split(' + ')[1],
    mood:[A.a.mood[0],A.a.mood[1],B.a.mood[0],B.a.mood[1]], luce:A.a.luce,
    ideas: shuffle(mixIdeas, r), tag: A.a.tag.slice(0,3).concat(B.a.tag.slice(0,2)),
    matched: all.filter(function(x,i){ return all.indexOf(x)===i; }), words:w, fusione:true };
  return [first, second, fus];
}

function tiles(c){
  var k = (c.words[0] || 'il mio feed'), p = c.pal, i = c.ideas;
  return [
    {t:i[0],c:p[0]}, {t:'«'+k+'»',c:p[2],q:1}, {t:i[1],c:p[1]},
    {t:'Colore del mese '+p[3],c:p[3]}, {t:i[2],c:p[4]}, {t:i[3],c:p[2]},
    {t:'Dettaglio: '+k,c:p[1]}, {t:i[4],c:p[3]}, {t:i[5],c:p[0]}
  ];
}
function bioOf(c){
  var w = c.words;
  return cap(w[0]||'Il mio mondo') + (w[1] ? ' & ' + w[1] : '') + '\n' + c.mood.slice(0,3).join(' · ');
}

function card(c, idx, saved, mode){
  var key = c.nome + '|' + c.words.join(',');
  var hits = c.matched.length
    ? '<div class="sec"><div class="kicker">Parole riconosciute</div><div class="chips">' + c.matched.slice(0,6).map(function(m){ return '<span class="chip hit">'+esc(m)+'</span>'; }).join('') + '</div></div>'
    : '';
  var bio = bioOf(c);
  var tags = c.tag.join(' ');
  return '<article class="card" data-key="'+esc(key)+'" data-i="'+idx+'" data-mode="'+mode+'">' +
    '<div class="card-head"><div><div class="kicker">' + (c.fusione ? 'Fusione su misura' : 'Estetica') + '</div><h2>'+esc(c.nome)+'</h2><p class="desc">'+esc(c.desc)+'</p></div>' +
    '<button class="save" type="button" data-act="save" aria-pressed="'+(saved?'true':'false')+'">'+(saved?'Salvata':'Salva')+'</button></div>' +
    hits +
    '<div class="sec"><div class="kicker">Palette · tocca per copiare</div><div class="pal">' + c.pal.map(function(h){ return '<button type="button" class="sw" data-act="copy" data-text="'+h+'" style="background:'+h+';color:'+textOn(h)+'">'+h+'</button>'; }).join('') + '</div></div>' +
    '<dl class="kv"><dt>Atmosfera</dt><dd><span class="chips">' + c.mood.map(function(m){ return '<span class="chip">'+esc(m)+'</span>'; }).join('') + '</span></dd><dt>Font</dt><dd>'+esc(c.font)+'</dd><dt>Luce</dt><dd>'+esc(c.luce)+'</dd></dl>' +
    '<div class="sec"><div class="kicker">Il tuo feed, 9 post</div><div class="grid">' + tiles(c).map(function(t){ return '<div class="tile'+(t.q?' q':'')+'" style="background:'+t.c+';color:'+textOn(t.c)+'">'+esc(t.t)+'</div>'; }).join('') + '</div></div>' +
    '<div class="sec"><div class="kicker">Bio suggerita</div><div class="bio">'+esc(bio)+'</div><div class="tags">'+esc(tags)+'</div></div>' +
    '<div class="actions"><button class="ghost" type="button" data-act="copy" data-text="'+esc(bio)+'">Copia bio</button><button class="ghost" type="button" data-act="copy" data-text="'+esc(tags)+'">Copia hashtag</button></div>' +
  '</article>';
}

var state = { results: [], seed: 0, saved: [] };
function load(){ try { var s = JSON.parse(localStorage.getItem('feed-estetiche-salvate')||'[]'); if (Array.isArray(s)) state.saved = s; } catch(e){} }
function persist(){ try { localStorage.setItem('feed-estetiche-salvate', JSON.stringify(state.saved)); } catch(e){} }
function keyOf(c){ return c.nome + '|' + c.words.join(','); }
function isSaved(c){ var k = keyOf(c); return state.saved.some(function(s){ return keyOf(s)===k; }); }

function toast(msg){
  var t = document.getElementById('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(function(){ t.hidden = true; }, 1800);
}
function copyText(text){
  function fallback(){
    try { var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); var ok=document.execCommand('copy'); document.body.removeChild(ta); toast(ok?'Copiato':'Copia non riuscita'); } catch(e){ toast('Copia non riuscita'); }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){ toast('Copiato'); }, fallback);
  else fallback();
}

function renderCreate(){
  var out = document.getElementById('out');
  var input = document.getElementById('kw').value.trim();
  if (!input) { out.innerHTML = '<p class="empty">Scrivi almeno una parola, per esempio «mare» o «libri».</p>'; return; }
  state.results = generate(input, state.seed);
  out.innerHTML = state.results.map(function(c,i){ return card(c,i,isSaved(c),'new'); }).join('');
  try { localStorage.setItem('feed-estetiche-input', input); } catch(e){}
}
function renderSaved(){
  var v = document.getElementById('view-salvate');
  document.getElementById('tab-salvate').textContent = 'Salvate (' + state.saved.length + ')';
  if (!state.saved.length) { v.innerHTML = '<p class="empty">Non hai ancora salvato niente. Tocca «Salva» su un\'estetica che ti piace.</p>'; return; }
  v.innerHTML = state.saved.map(function(c,i){ return card(c,i,true,'saved'); }).join('');
}
function show(which){
  var crea = which === 'crea';
  document.getElementById('view-crea').hidden = !crea;
  document.getElementById('view-salvate').hidden = crea;
  document.getElementById('tab-crea').setAttribute('aria-pressed', crea);
  document.getElementById('tab-salvate').setAttribute('aria-pressed', !crea);
  if (!crea) renderSaved();
}

document.getElementById('ex').innerHTML = EXAMPLES.map(function(e){ return '<button type="button" data-ex="'+esc(e)+'">'+esc(e)+'</button>'; }).join('');
document.getElementById('f').addEventListener('submit', function(e){ e.preventDefault(); state.seed = 0; renderCreate(); });
document.getElementById('more').addEventListener('click', function(){ state.seed++; renderCreate(); });
document.getElementById('tab-crea').addEventListener('click', function(){ show('crea'); });
document.getElementById('tab-salvate').addEventListener('click', function(){ show('salvate'); });
document.addEventListener('click', function(e){
  var ex = e.target.closest('[data-ex]');
  if (ex) { document.getElementById('kw').value = ex.getAttribute('data-ex'); state.seed = 0; renderCreate(); return; }
  var b = e.target.closest('[data-act]'); if (!b) return;
  if (b.dataset.act === 'copy') { copyText(b.dataset.text); return; }
  if (b.dataset.act === 'save') {
    var cardEl = b.closest('.card'), i = +cardEl.dataset.i, mode = cardEl.dataset.mode;
    var c = mode === 'saved' ? state.saved[i] : state.results[i];
    var k = keyOf(c);
    if (isSaved(c)) { state.saved = state.saved.filter(function(s){ return keyOf(s)!==k; }); toast('Rimossa dalle salvate'); }
    else { state.saved.push(c); toast('Salvata'); }
    persist();
    document.getElementById('tab-salvate').textContent = 'Salvate (' + state.saved.length + ')';
    if (mode === 'saved') renderSaved(); else renderCreate();
  }
});

load();
try { var prev = localStorage.getItem('feed-estetiche-input'); if (prev) document.getElementById('kw').value = prev; } catch(e){}
document.getElementById('tab-salvate').textContent = 'Salvate (' + state.saved.length + ')';
renderCreate();
</script>

</body>
